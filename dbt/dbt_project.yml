name: redbull_delivery
version: "0.1.0"
config-version: 2

profile: redbull_delivery

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

models:
  redbull_delivery:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table          # 2 models, each with >1 consumer + heavy aggregation
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      # re-assert market-scoped row-level security after each rebuild
      # (only models that carry a market_code column)
      core:
        dim_market:
          +post-hook: "{{ apply_market_row_access_policy(this) }}"
        dim_outlet:
          +post-hook: "{{ apply_market_row_access_policy(this) }}"
      facts:
        +post-hook: "{{ apply_market_row_access_policy(this) }}"

seeds:
  redbull_delivery:
    +schema: staging

vars:
  # markets present in this load; drives per-market tests
  markets: ["USA", "GBR", "DEU"]
  "dbt_date:time_zone": "UTC"
