name: CI

# Python-only checks: lint, type-check, unit tests. No Snowflake credentials
# required, so this runs on every push/PR with zero secrets to manage.
#
# The Snowflake-connected half of CI/CD (dbt build against an isolated
# per-PR schema, with tests gating the merge) is described, not run here —
# see docs/cicd_design.md for the full design and why it's not wired up yet.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy ingest config rbac genai

      - name: Unit tests (pytest)
        run: uv run pytest -q
